<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WebAR Drink Menu - PBR Glass Fix</title>
    
    <!-- A-Frame v1.5.0 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- MindAR per A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- Componente Environment (indispensabile per i riflessi del vetro) -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #ui-overlay {
        position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 999;
        background: rgba(0, 0, 0, 0.75); color: white; padding: 12px 24px; border-radius: 25px;
        font-size: 14px; text-align: center; pointer-events: none; backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2); transition: opacity 0.3s ease;
      }
      #scan-guide {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 250px; height: 250px; border: 2px dashed rgba(255, 255, 255, 0.5);
        border-radius: 15px; z-index: 998; pointer-events: none; transition: opacity 0.3s ease;
      }
      .hidden { opacity: 0; }
    </style>
  </head>
  <body>

    <div id="scan-guide"></div>
    <div id="ui-overlay">Inquadra il menu</div>

    <!-- AGGIORNATO RENDERER: physicallyCorrectLights è deprecato, usiamo le impostazioni PBR moderne -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiError: yes; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true; exposure: 1.2; toneMapping: ACESFilmic;" <!-- ToneMapping aiuta la resa PBR -->
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets timeout="10000">
        <a-asset-item id="drinkModel" src="./cocktail.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- AGGIORNATO ENVIRONMENT: 
           Usiamo 'shrineroom' o 'studio' per riflessi neutri e puliti.
           lighting: point fornisce una luce di base PBR. -->
      <a-entity environment="preset: shrineroom; lighting: point; lightPosition: 1 2 1; ground: none; skyType: atmosphere; skyColor: #222; showGround: false;"></a-entity>

      <!-- Luci aggiuntive per dare brillantezza (rimuovi se l'environment lighting è sufficiente) -->
      <a-light type="ambient" intensity="0.8"></a-light>
      <a-light type="directional" position="1 4 2" intensity="1.0"></a-light>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <!-- MODIFICATO: rotation="-90 0 0" per orientamento perpendicolare -->
        <a-gltf-model 
          src="#drinkModel" 
          position="0 0 0" 
          rotation="-90 0 0" 
          scale="0.5 0.5 0.5">
        </a-gltf-model>
      </a-entity>

    </a-scene>

    <script>
      const targetEntity = document.querySelector('#target');
      const uiOverlay = document.querySelector('#ui-overlay');
      const scanGuide = document.querySelector('#scan-guide');
      targetEntity.addEventListener("targetFound", () => { uiOverlay.textContent = "Cocktail trovato!"; scanGuide.classList.add('hidden'); });
      targetEntity.addEventListener("targetLost", () => { uiOverlay.textContent = "Inquadra il menu"; scanGuide.classList.remove('hidden'); });
    </script>
  </body>
</html>
