<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WebAR Drink Menu</title>
    
    <!-- 1. A-Frame v1.5.0 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- 2. MindAR per A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- 3. Componente Environment per i riflessi PBR -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      #ui-overlay {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(0, 0, 0, 0.75);
        color: #ffffff;
        padding: 12px 24px;
        border-radius: 25px;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        pointer-events: none;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition: opacity 0.3s ease;
      }

      #scan-guide {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 260px;
        height: 260px;
        border: 2px dashed rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        z-index: 998;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .hidden {
        opacity: 0;
      }
    </style>

    <!-- Componente Custom Three.js per Vetro PBR -->
    <script>
      AFRAME.registerComponent('glass-material', {
        schema: {
          ior: { type: 'number', default: 1.5 },
          transmission: { type: 'number', default: 0.95 },
          roughness: { type: 'number', default: 0.05 },
          thickness: { type: 'number', default: 0.5 }
        },
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;

            mesh.traverse((node) => {
              if (node.isMesh) {
                node.material = new THREE.MeshPhysicalMaterial({
                  color: 0xffffff,
                  transmission: this.data.transmission,
                  opacity: 1.0,
                  transparent: true,
                  roughness: this.data.roughness,
                  ior: this.data.ior,
                  thickness: this.data.thickness,
                  specularIntensity: 1.0,
                  clearcoat: 1.0,
                  clearcoatRoughness: 0.1
                });
                node.material.needsUpdate = true;
              }
            });
          });
        }
      });
    </script>
  </head>
  <body>

    <div id="scan-guide"></div>
    <div id="ui-overlay">Inquadra l'immagine nel menu</div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiError: yes; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true; exposure: 1.2; toneMapping: ACESFilmic;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets timeout="10000">
        <a-asset-item id="drinkModel" src="./cocktail.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity environment="preset: studio; lighting: point; lightPosition: 1 3 2; ground: none; skyType: none; showGround: false;"></a-entity>

      <a-light type="ambient" intensity="0.8"></a-light>
      <a-light type="directional" position="1 4 2" intensity="1.2"></a-light>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <!-- 
          MODIFICATO:
          - rotation="90 0 0": Inverte il verso della perpendicolarità.
          - scale="0.8 0.8 0.8": Aumenta notevolmente le dimensioni del modello.
        -->
        <a-gltf-model 
          src="#drinkModel" 
          position="0 0 0" 
          rotation="270 0 0" 
          scale="5 5 5"
          glass-material="transmission: 0.95; roughness: 0.05; ior: 1.5">
        </a-gltf-model>
      </a-entity>

    </a-scene>

    <script>
      const targetEntity = document.querySelector('#target');
      const uiOverlay = document.querySelector('#ui-overlay');
      const scanGuide = document.querySelector('#scan-guide');

      targetEntity.addEventListener("targetFound", () => {
        uiOverlay.textContent = "Cocktail rilevato!";
        scanGuide.classList.add('hidden');
      });

      targetEntity.addEventListener("targetLost", () => {
        uiOverlay.textContent = "Inquadra l'immagine nel menu";
        scanGuide.classList.remove('hidden');
      });
    </script>
  </body>
</html>
