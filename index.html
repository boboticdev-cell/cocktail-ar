<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WebAR Drink Menu</title>
    
    <!-- 1. A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- 2. MindAR per A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- 3. Componente Environment per i riflessi del Vetro/PBR -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      /* Sfondo di caricamento pulito mentre si avvia la fotocamera */
      #example-scanning-overlay {
        display: flex; align-items: center; justify-content: center;
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.5); z-index: 2;
      }
      #example-scanning-overlay.hidden { display: none; }
    </style>
  </head>
  <body>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true, exposure: 1.0;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <!-- CARICAMENTO ASSET -->
      <a-assets>
        <!-- Modello 3D (.glb) del drink espoerato da Blender -->
        <a-asset-item id="drinkModel" src="./cocktail.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- AMBIENTE & RIFLESSI (Indispensabile per il vetro): 
           Utilizza un preset neutro ("studio" o "downtown") per generare la mappa di riflessione 
           senza dover mostrare il cielo/sfondo reale (showGround: false) -->
      <a-entity environment="preset: studio; lighting: none; showGround: false; skyType: none;"></a-entity>

      <!-- LUCI DELLA SCENA -->
      <a-light type="ambient" intensity="1.2"></a-light>
      <a-light type="directional" position="1 4 2" intensity="1.5" cast-shadow="true"></a-light>

      <!-- TARGET AR (L'immagine del menu che attiva l'AR) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Modello 3D ancorato all'immagine -->
        <a-gltf-model 
          src="#drinkModel" 
          position="0 0 0" 
          rotation="0 0 0" 
          scale="0.5 0.5 0.5">
        </a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html>
